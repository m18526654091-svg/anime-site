services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: animehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a strong password (see .env.example)}
      POSTGRES_DB: animehub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animehub -d animehub"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-1.6.0}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://animehub:${POSTGRES_PASSWORD}@postgres:5432/animehub
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in your .env (see .env.example)}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS to your real origins (comma-separated), e.g. https://your-domain.com}
      APP_VERSION: ${APP_VERSION:-1.6.0}
      APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-1.7.0}
        NEXT_PUBLIC_APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL e.g. https://your-domain.com}
      NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-1.7.0}
      NEXT_PUBLIC_APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get({hostname:'127.0.0.1',port:3000,path:'/'},r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN e.g. your-domain.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
